name: CMake GCC

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CXX_COMPILER: g++-14
  C_COMPILER: gcc-14

jobs:
  build:
    strategy:
      matrix:
        build_type: [Release, Debug]
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{github.workspace}}/build/${{matrix.build_type}}

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Configure CMake
      run: cmake -B ${{env.BUILD_DIR}} -DCMAKE_CXX_COMPILER=${{env.CXX_COMPILER}} -DCMAKE_C_COMPILER=${{env.C_COMPILER}} -DCMAKE_BUILD_TYPE=${{matrix.build_type}}

    - name: Build
      run: cmake --build ${{env.BUILD_DIR}} --config ${{matrix.build_type}}

    - name: Test
      working-directory: ${{env.BUILD_DIR}}
      run: ctest -C ${{matrix.build_type}}

    - name: Generate coverage report
      if: ${{matrix.build_type == 'Debug'}}
      working-directory: ${{github.workspace}}
      run: |
        set -eux
        python3 -m pip install --upgrade pip
        python3 -m pip install gcovr
        g++-14 --version
        gcov-14 --version
        gcovr --version
        gcovr -r . --gcov-executable gcov-14 --object-directory ${{env.BUILD_DIR}} --exclude 'test/.*' --exclude '3p/.*' --lcov -o coverage.info

    - name: Upload coverage to Codecov
      if: ${{matrix.build_type == 'Debug'}}
      uses: codecov/codecov-action@v3
      with:
        fail_ci_if_error: true
        verbose: true
        files: coverage.info
